<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Locus - Registo</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#7c3aed">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Locus">
    
    <link rel="icon" href="./icon-96.png" type="image/png">
    <link rel="shortcut icon" href="./icon-96.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="stylesheet" href="locus.css">
    
    <style>
        /* Estrutura base para centrar o card no ecrã inteiro */
        #tela-cadastro {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 20px;
            width: 100%;
            background: var(--bg-body);
        }

        .link-voltar {
            display: block;
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--texto-secundario);
            text-decoration: none;
            transition: var(--trans);
        }

        .link-voltar:hover {
            color: var(--cor-primaria);
        }
    </style>
</head>
<body>

    <div id="tela-cadastro">
        
        <h2 id="titulo-app">Locus</h2>

        <div class="nav-card animado">
            <div class="nav-card-header">
                <div class="card-icon">📝</div>
                <div class="card-textos">
                    <h2>Criar Acesso</h2>
                    <p>Preencha os seus dados para solicitar o PIN</p>
                </div>
            </div>

            <div class="form-group" style="margin-top: 16px;">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Ex: João Silva" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="disciplina">Disciplina / Cargo</label>
                <input type="text" id="disciplina" placeholder="Ex: Matemática" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="pin">Crie um PIN (4 dígitos)</label>
                <input type="tel" id="pin" maxlength="4" placeholder="••••" autocomplete="off">
            </div>

            <button id="btn-solicitar" class="principal">Solicitar Acesso</button>

            <a href="index.html" class="link-voltar">← Voltar ao início</a>
        </div>
    </div>

    <script type="module" src="cadrasto.js"></script>
</body>
</html>
