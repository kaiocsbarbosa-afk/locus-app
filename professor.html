<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Locus - Professor</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#7c3aed">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Locus">
    
    <link rel="icon" href="./icon-96.png" type="image/png">
    <link rel="shortcut icon" href="./icon-96.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="stylesheet" href="locus.css">
    
    <style>
        /* CSS Mínimo para a Tela de Login e PIN */
        #tela-login {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 20px;
            width: 100%;
            background: var(--bg-body);
        }

        /* Mantém o estilo do input invisível do PIN e das bolinhas para o JS funcionar */
        .pin-wrapper { position: relative; display: flex; justify-content: center; margin-bottom: 24px; align-self: stretch; }
        #pin-input-real { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; font-size: 16px; cursor: pointer; z-index: 2; }
        .pin-dots { display: flex; gap: 10px; pointer-events: none; }
        
        /* Bolinhas do PIN adaptadas para o novo CSS */
        .pin-dot { 
            width: 50px; height: 56px; 
            border: 2px solid var(--borda); 
            border-radius: var(--raio-sm); 
            background: var(--bg-input); 
            display: flex; align-items: center; justify-content: center; 
            transition: var(--trans); position: relative; 
        }
        .pin-dot::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--borda); }
        .pin-dot.ativo { border-color: var(--cor-primaria); transform: scale(1.05); }
        .pin-dot.ativo::before { background: var(--cor-primaria); transform: scale(1.2); }
        .pin-dot.preenchido { border-color: var(--cor-primaria); background: var(--cor-primaria-clara); }
        .pin-dot.preenchido::before { display: none; }
        .pin-dot .pin-char { font-size: 1.5rem; font-weight: 800; color: var(--texto-principal); line-height: 1; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="tela-login">
        
        <h2 id="titulo-app">Locus</h2>

        <div class="nav-card animado">
            <div class="nav-card-header">
                <div class="card-icon">👤</div>
                <div class="card-textos">
                    <h2>Acesso Restrito</h2>
                    <p>Selecione seu perfil e informe o PIN</p>
                </div>
            </div>

            <div id="login-step1" class="form-group" style="margin-top: 16px;">
                <label for="select-professor">Professor(a)</label>
                <div class="login-select-wrap">
                    <select id="select-professor">
                        <option value="">Buscando professores...</option>
                    </select>
                </div>
                <button id="btn-continuar" class="principal">Continuar</button>
            </div>

            <div id="login-step2" class="form-group" style="display: none; margin-top: 16px;">
                
                <div class="pin-header" style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
                    <button class="pin-back-btn btn-cancelar" style="padding: 6px 12px; font-size: 14px;">←</button>
                    <span class="pin-usuario-nome" style="font-weight: 600; color: var(--texto-principal); font-size: 14px;"></span>
                </div>

                <div class="pin-wrapper">
                    <input type="tel" id="pin-input-real" maxlength="4" autocomplete="off">
                    <div class="pin-dots">
                        <div class="pin-dot ativo"><span class="pin-char"></span></div>
                        <div class="pin-dot"><span class="pin-char"></span></div>
                        <div class="pin-dot"><span class="pin-char"></span></div>
                        <div class="pin-dot"><span class="pin-char"></span></div>
                    </div>
                </div>

                <button id="btn-entrar" class="principal">Entrar no Sistema</button>
            </div>
        </div>
    </div>

    <script type="module" src="professor.js"></script>
</body>
</html>
