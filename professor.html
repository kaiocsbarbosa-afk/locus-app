<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locus — Professor</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6d28d9">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="locus.css">
</head>
<body>
<div class="container">
    <div class="header-controles">
        <button class="btn-toggle-modo" onclick="toggleDarkMode()" id="txt-modo">🌙 Escuro</button>
        <button class="btn-sair hidden" id="btn-sair" onclick="fazerLogout()">Sair 🚪</button>
    </div>

    <h2 id="titulo-app">Locus</h2>

    <div id="secao-login">
        <div class="form-group">
            <label for="pin-professor">PIN de Identificação</label>
            <input type="password" id="pin-professor" placeholder="Digite seu PIN numérico..." inputmode="numeric" autocomplete="current-password">
        </div>
        <button id="btn-login" class="principal" onclick="fazerLogin(null)">Entrar no sistema</button>
    </div>

    <div id="secao-agendamento" class="hidden">
        <div class="status-card" id="status-usuario">Carregando...</div>

        <div class="form-group">
            <label for="data-agendamento">Data de agendamento</label>
            <input type="date" id="data-agendamento" onchange="buscarAulas()">
        </div>

        <div class="form-group">
            <label for="select-sala">Sala</label>
            <select id="select-sala" onchange="buscarAulas()">
                <option value="">Selecione uma sala...</option>
            </select>
        </div>

        <div class="form-group" id="container-turma">
            <label for="select-turma">Turma destinada</label>
            <select id="select-turma">
                <option value="">Selecione a turma...</option>
            </select>
        </div>

        <h3 id="titulo-grade">Grade horária</h3>
        <div id="grid-aulas">
            <div class="grid-vazio">
                <div class="icone-vazio">🗓️</div>
                <p>Selecione uma data e uma sala para ver os horários disponíveis.</p>
            </div>
        </div>

        <div class="historico-secao hidden" id="secao-historico">
            <div class="historico-titulo">📅 Seus agendamentos ativos</div>
            <div id="historico-lista"></div>
        </div>
    </div>
</div>

<script type="module" src="professor.js"></script>
</body>
</html>
